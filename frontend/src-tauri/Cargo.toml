[package]
name = "ma-ipaas-desktop"
version = "1.0.0"
description = "MA-IPAAS intelligent personal affairs assistant desktop shell"
authors = ["MA-IPAAS Team"]
edition = "2021"

[lib]
name = "ma_ipaas_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.10.1", features = ["tray-icon"] }
tauri-plugin-notification = "2.3.3"
