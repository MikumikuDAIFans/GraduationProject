services:
  redis:
    image: redis:7.4-alpine
    container_name: graduation-project-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    container_name: graduation-project-api
    working_dir: /app
    env_file:
      - ./.env
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: sqlite+aiosqlite:////app/data/app.db
      SQLITE_DB_PATH: /app/data/app.db
    volumes:
      - ./backend:/app
      - ./backend/data:/app/data
      - ./chroma_db:/app/chroma_db
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -lc
      - |
        echo "Waiting for Redis..."
        python scripts/wait_for_redis.py
        echo "Running database migrations..."
        alembic upgrade head || echo "Migration failed, continuing anyway..."
        echo "Starting API server..."
        uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  celery_worker:
    build: ./backend
    container_name: graduation-project-celery-worker
    working_dir: /app
    env_file:
      - ./.env
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: sqlite+aiosqlite:////app/data/app.db
      SQLITE_DB_PATH: /app/data/app.db
    volumes:
      - ./backend:/app
      - ./backend/data:/app/data
      - ./chroma_db:/app/chroma_db
    depends_on:
      redis:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -lc
      - |
        echo "Waiting for Redis..."
        python scripts/wait_for_redis.py
        echo "Starting Celery worker..."
        celery -A app.core.celery_app.celery_app worker -l info
    restart: unless-stopped

  celery_beat:
    build: ./backend
    container_name: graduation-project-celery-beat
    working_dir: /app
    env_file:
      - ./.env
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: sqlite+aiosqlite:////app/data/app.db
      SQLITE_DB_PATH: /app/data/app.db
    volumes:
      - ./backend:/app
      - ./backend/data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -lc
      - |
        echo "Waiting for Redis..."
        python scripts/wait_for_redis.py
        echo "Starting Celery beat..."
        celery -A app.core.celery_app.celery_app beat -l info --schedule=/app/data/celerybeat-schedule
    restart: unless-stopped
